<section *ngIf="isModelLoaded">
    <form [formGroup]="invoiceFormGroup">
        <ngx-card [config]="{width:'100%'}">
            <div class="row">
                <div class="col-12 text-orange mb-3">
                    Invoice Details
                </div>
                <div class="col-12 col-sm-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Client</mat-label>
                        <mat-select [formControlName]="InvoiceFormKey.ClientId">
                            @for (client of clienOptions(); track client) {
                            <mat-option [value]="client.id">{{client.name}}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="col-12 col-sm-6">
                    <mat-form-field appearance="outline">
                        <mat-label>Due Date</mat-label>
                        <input matInput [matDatepicker]="picker" [formControlName]="InvoiceFormKey.DueDate" />
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                </div>
                <div>
                    <mat-form-field appearance="outline" class="w-100">
                        <mat-label class="text-wrap">Add instructions or notes...</mat-label>
                        <textarea matInput rows="4" [formControlName]="InvoiceFormKey.Notes"></textarea>
                    </mat-form-field>
                </div>
            </div>
        </ngx-card>
    </form>
</section>
