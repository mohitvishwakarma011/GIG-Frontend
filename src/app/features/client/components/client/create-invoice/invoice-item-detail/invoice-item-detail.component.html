<section class="mt-3">
  <ngx-card [config]="{width:'100%'}">
    <div class="row">
      <div class="col-12">
        <form>
          <div class="table-bordered mt-2">
            <table mat-table [dataSource]="invoiceItemFormGroupList.controls">
              <ng-container matColumnDef="#">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element">
                  <mat-form-field appearance="outline">
                    <input matInput [formControlName]="element."/>
                  </mat-form-field>
                </td>
              </ng-container>
              <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Description</th>
                <td mat-cell *matCellDef="let element"> </td>
              </ng-container>
              <ng-container matColumnDef="hsnCode">
                <th mat-header-cell *matHeaderCellDef>HSN/SAC</th>
                <td mat-cell *matCellDef="let element"> </td>
              </ng-container>
              <ng-container matColumnDef="quantity">
                <th mat-header-cell *matHeaderCellDef>Quantity</th>
                <td mat-cell *matCellDef="let element"></td>
              </ng-container>
              <ng-container matColumnDef="rate">
                <th mat-header-cell *matHeaderCellDef>Rate</th>
                <td mat-cell *matCellDef="let element"></td>
              </ng-container>
              <ng-container matColumnDef="amount">
                <th mat-header-cell *matHeaderCellDef>Amount</th>
                <td mat-cell *matCellDef="let element"></td>
              </ng-container>
              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element">
                  <!-- <div class="actions">
                    <i class="fi fi-rr-eye"></i>
                    <i (click)="deleteInvoice(element.id)" class="fi fi-rr-trash"
                      *ngIf="element.status === invoiceStatus.draft"></i>
                    <i (click)="downloadInvoice(element.id)" class="fi fi-rr-download"
                      *ngIf="element.status !== invoiceStatus.draft"></i>
                  </div> -->
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

              <tr class="mat-row" *matNoDataRow>
                <td class="text-center" [attr.colspan]="displayedColumns.length">
                  No records found
                </td>
              </tr>
            </table>
          </div>
        </form>
      </div>
    </div>
  </ngx-card>
</section>
