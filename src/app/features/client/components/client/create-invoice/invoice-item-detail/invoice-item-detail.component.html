<section *ngIf="isModelLoaded()" class="mt-3">
  <ngx-card [config]="{width:'100%'}">
    <div class="row">
      <div class="col-12">
        <form [formGroup]="invoiceItemFormGroup">
          <div class="table-bordered mt-2">
            <table mat-table [dataSource]="invoiceItems.controls">
              <ng-container matColumnDef="#">
                <th mat-header-cell *matHeaderCellDef>#</th>
                <td mat-cell *matCellDef="let element; let i = index">{{ i + 1 }}</td>
              </ng-container>

              <ng-container matColumnDef="description">
                <th mat-header-cell *matHeaderCellDef>Description</th>
                <td mat-cell *matCellDef="let element">
                  <mat-form-field appearance="outline" class="w-100">
                    <input matInput [formControl]="element.get(InvoiceFormKey.Description)">
                  </mat-form-field>
                </td>
              </ng-container>

              <ng-container matColumnDef="hsnCode">
                <th mat-header-cell *matHeaderCellDef>HSN/SAC</th>
                <td mat-cell *matCellDef="let element">
                  <mat-form-field appearance="outline" class="w-100">
                    <input matInput [formControl]="element.get(InvoiceFormKey.HsnCode)">
                  </mat-form-field>
                </td>
              </ng-container>

              <ng-container matColumnDef="quantity">
                <th mat-header-cell *matHeaderCellDef>Quantity</th>
                <td mat-cell *matCellDef="let element">
                  <mat-form-field appearance="outline" class="w-100">
                    <input matInput type="number" [formControl]="element.get(InvoiceFormKey.Quantity)">
                  </mat-form-field>
                </td>
              </ng-container>

              <ng-container matColumnDef="rate">
                <th mat-header-cell *matHeaderCellDef>Rate</th>
                <td mat-cell *matCellDef="let element">
                  <mat-form-field appearance="outline" class="w-100">
                    <input matInput type="number" [formControl]="element.get(InvoiceFormKey.Rate)">
                  </mat-form-field>
                </td>
              </ng-container>

              <ng-container matColumnDef="amount">
                <th mat-header-cell *matHeaderCellDef>Amount</th>
                <td mat-cell *matCellDef="let element">{{ getAmount(element) | currency:'INR' }}</td>
              </ng-container>

              <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element; let i = index">
                  <button type="button" mat-icon-button color="warn" (click)="removeItem(i)" aria-label="Remove item">
                    <i class="fi fi-rr-trash"></i>
                  </button>
                </td>
              </ng-container>

              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

              <tr class="mat-row" *matNoDataRow>
                <td class="text-center" [attr.colspan]="displayedColumns.length">
                  No records found
                </td>
              </tr>
            </table>
          </div>

          <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-outline-primary" (click)="addItem()">
              <i class="fi fi-rr-plus"></i> Add Item
            </button>
          </div>
        </form>
      </div>
    </div>
  </ngx-card>
</section>
