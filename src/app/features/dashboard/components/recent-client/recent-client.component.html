<section>
    <ngx-card [config]="{width:'100%'}">
        <div class="d-flex align-items-center justify-content-between">
            <span>Recent Clients</span>
            <ngx-card [config]="{padding:'6px'}">
                <div class="d-flex align-items-center justify-content-center gap-2 cursor-pointer" routerLink="/client">
                    <i class="fi fi-rs-arrow-up-right small-icon"></i>
                    View all
                </div>
            </ngx-card>
        </div>
        <div class="row mt-2">
            @for (item of clients(); track item.id) {
            <div class="col-12 col-md-6 mt-2">
                <ngx-card [config]="{width:'100%'}">
                    <div class="row">
                        <div class="col-6">
                            <mat-chip class="chip-complete">{{item.name.substring(0,2)}}</mat-chip>
                        </div>
                        <div class="col-6 text-end text-md-center">
                            <div class="text-wrap">{{item.name}}</div>
                            <div class="text-wrap gst-number">{{item.gstin}}</div>
                        </div>
                        <div class="col-12 text-link ">
                            {{item.state}}
                        </div>
                    </div>
                </ngx-card>
            </div>
            }
        </div>
    </ngx-card>
</section>
